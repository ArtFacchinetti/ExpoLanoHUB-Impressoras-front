name: impressoras-front

services:
  web:
    image: impressoras-front:local
    build: .
    restart: unless-stopped
    ports:
      - "${FRONT_BIND_IP:-0.0.0.0}:${FRONT_PORT:-8080}:80"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  backend:
    external: true
    name: ${BACKEND_DOCKER_NETWORK:-impressoras_default}
